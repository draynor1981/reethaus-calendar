name: Update Reethaus calendar

on:
  schedule:
    - cron: "17 5 * * *"   # daily at 05:17 UTC (~07:17 Berlin time)
  workflow_dispatch: {}     # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated feed
        run: |
          git config user.name "reethaus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reethaus.ics
          if git diff --cached --quiet; then
            echo "No changes to the feed."
          else
            git commit -m "Update calendar feed ($(date -u +%Y-%m-%d))"
            git push
          fi
